services:
  gsplat-car:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gsplat-car
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - QT_QPA_PLATFORM=offscreen
      - PYTHONUNBUFFERED=1
    volumes:
      # 入力画像と出力結果のマウント
      - ../data:/workspace/data:rw
      - ../output:/workspace/output:rw
      - ../config:/workspace/config:ro
      # ソースコードのマウント
      - ../src:/workspace/src:ro
    working_dir: /workspace
    command: >
      bash -c "
      # __pycache__をクリアして古いバイトコンパイルを削除
      find /workspace/src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      # メインスクリプトを実行
      python3 -u src/main.py --config config/config.yaml
      "
    # GPUアクセスを確保
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
