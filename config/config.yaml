# gasplat-car 設定ファイル

# データディレクトリ
data:
  # COLMAP作業ディレクトリ
  colmap_work_dir: "data/colmap_work"

# 入力画像の設定
input:
  # 入力画像のディレクトリ（data/input内）
  image_dir: "data/input"
  # 画像数（8枚を想定）
  num_images: 8
  # 画像のリサイズ解像度（最大の辺の長さ）
  max_image_size: 2048

# Gaussian Splatting 訓練パラメータ
training:
  # 訓練イテレーション数
  num_iterations: 30000
  # ランダムシード
  seed: 42
  # 学習率
  learning_rate: 0.01
  # オプタイマイザ（Adam）
  optimizer:
    type: "adam"
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-15

# 画像前処理パラメータ
preprocessing:
  # 特徴点検出アルゴリズム
  feature_detector: "sift"
  # 特徴点の最大数
  max_features: 4096

# COLMAPパラメータ
colmap:
  # Feature Extractor
  extractor:
    camera_model: "SIMPLE_RADIAL"  # COLMAP 3.7+ではSIMPLE_RADIALのみ
    max_image_size: 1024
    num_threads: 8
    # 最大特徴点数
    max_num_features: 4096
    # SIFT閾値（デフォルト値を使用）
    sift_peak_threshold: 0.0066666666666666671
    sift_edge_threshold: 10
  
  # Feature Matcher
  matcher:
    type: "exhaustive"  # exhaustive, vocabulary_tree
    vocabulary_tree_file: ""  # 指定しない場合はexhaustiveモード
    # 最大マッチ数
    max_num_matches: 8192
  
  # Bundle Adjustment
  mapper:
    min_num_matches: 6
    max_num_iterations: 100
    allowed_range_ratio: 0.05
    init_min_tri_angle: 1.0
    ba_global_max_num_iterations: 200

# メッシュ化パラメータ
meshing:
  # 法線推定の解像度
  normal_resolution: 512
  # マテリアルの解像度
  material_resolution: 1024
  # Poisson Reconstructionの深さ
  poisson_depth: 9
  # 削除する頂点の閾値（軽すぎる頂点）
  remove_small_geometry_threshold: 0.01

# 出力設定
output:
  # 出力ディレクトリ
  dir: "output"
  # 出力形式（glb, obj, 両方）
  formats: ["glb", "obj"]
  # ファイル名プレフィックス
  filename_prefix: "car_model"
