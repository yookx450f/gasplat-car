# gasplat-car 設定ファイル

# データディレクトリ
data:
  # COLMAP作業ディレクトリ
  colmap_work_dir: "data/colmap_work"

# 入力画像の設定
input:
  # 入力画像のディレクトリ（data/input内）
  image_dir: "data/input"
  # 画像数（8枚を想定）
  num_images: 8
  # 画像のリサイズ解像度（最大の辺の長さ）
  max_image_size: 2048

# Gaussian Splatting 訓練パラメータ
training:
  # 訓練イテレーション数
  num_iterations: 30000
  # ランダムシード
  seed: 42
  # 学習率
  learning_rate: 0.01
  # オプタイマイザ（Adam）
  optimizer:
    type: "adam"
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-15

# 画像前処理パラメータ
preprocessing:
  # 特徴点検出アルゴリズム
  feature_detector: "sift"
  # 特徴点の最大数
  max_features: 4096

# COLMAPパラメータ
colmap:
  # Feature Extractor
  extractor:
    camera_model: "SIMPLE_RADIAL"  # COLMAP 3.7+ではSIMPLE_RADIALのみ
    max_image_size: 1024
    num_threads: 8
    # 最大特徴点数
    max_num_features: 4096
    # SIFT閾値（デフォルト値を使用）
    sift_peak_threshold: 0.0066666666666666671
    sift_edge_threshold: 10
  
  # Feature Matcher
  matcher:
    type: "exhaustive"  # exhaustive, vocabulary_tree
    vocabulary_tree_file: ""  # 指定しない場合はexhaustiveモード
    # 最大マッチ数
    max_num_matches: 8192
  
  # Bundle Adjustment
  mapper:
    min_num_matches: 6
    max_num_iterations: 100
    allowed_range_ratio: 0.05
    init_min_tri_angle: 1.0
    ba_global_max_num_iterations: 200

# メッシュ化パラメータ
meshing:
  # 法線推定の解像度
  normal_resolution: 512
  # マテリアルの解像度
  material_resolution: 1024
  # Poisson Reconstructionの深さ
  poisson_depth: 9
  # 削除する頂点の閾値（軽すぎる頂点）
  remove_small_geometry_threshold: 0.01

# 出力設定
output:
  # 出力ディレクトリ
  dir: "output"
  # 出力形式（glb, obj, 両方）
  formats: ["glb", "obj"]
  # ファイル名プレフィックス
  filename_prefix: "car_model"

# 背景透過（フェーズ1 ステップ1）
masking:
  # 有効化
  enabled: true
  # 入力画像ディレクトリ（生画像）
  masked_input_dir: "data/1raw_images"
  # 出力画像ディレクトリ（背景透過画像）
  masked_output_dir: "data/2masked_images"
  # 出力形式: transparent(透明PNG) または white(白背景JPEG)
  masked_output_format: "transparent"
  # rembg エンジン (u2net, u2netp, u2net_humans, etc.)
  rembg_engine: "u2net"

# パーツ別セグメンテーション（フェーズ1 ステップ2）
part_segmentation:
  # 有効化
  enabled: true
  # 入力画像ディレクトリ（ステップ1の背景透過画像）
  part_masks_input_dir: "data/2masked_images"
  # 出力ディレクトリ
  part_masks_output_dir: "data/3part_masks"
  # SAM2使用の有無（Falseの場合はヒューリスティック処理）
  use_sam2: false
  # サポートされるパーツ
  parts:
    glass: "窓ガラス"
    wheels: "ホイール"
    body: "ボディ"
    other: "その他（ライト・グリル等）"

# 中間結果出力設定
intermediate_output:
  # 出力の有効化
  enabled: true
  # 出力ディレクトリ
  dir: "output/intermediate"
  # Gaussian Splatting訓練中の出力間隔（イテレーション数）
  gs_render_interval: 5000
